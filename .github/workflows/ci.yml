name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make static VERSION="$GITHUB_SHA" VITE_APP_VERSION="$GITHUB_SHA"
      - run: make test
      - run: node --test edge/worker.test.mjs
      - run: go vet ./...
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start static Worker against the exported objects
        id: static
        run: |
          node edge/serve-local.mjs > "$RUNNER_TEMP/static-worker.log" 2>&1 &
          echo "STATIC_PID=$!" >> "$GITHUB_ENV"
      - run: node scripts/smoke.mjs
      - name: Browser regression tests
        run: npm --prefix frontend run test:browser
      - name: Collect static Worker logs
        if: failure() && steps.static.outcome == 'success'
        run: |
          mkdir -p frontend/test-results
          cp "$RUNNER_TEMP/static-worker.log" frontend/test-results/static-worker.log
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Stop static Worker
        if: always() && steps.static.outcome == 'success'
        run: kill "$STATIC_PID"
      - name: Upload private browser source maps
        if: github.repository == 'TheOutdoorProgrammer/manifests.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FARO_SOURCEMAP_API_KEY: ${{ secrets.FARO_SOURCEMAP_API_KEY }}
        run: node frontend/scripts/upload-source-maps.mjs frontend/dist/assets
      - name: Remove private browser source maps
        if: always()
        run: rm -f frontend/dist/assets/*.js.map
      - name: Package verified static release
        if: github.repository == 'TheOutdoorProgrammer/manifests.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/static-package"
          tar -cf "$RUNNER_TEMP/static-package/static-release.tar" -C build/static .
          manifest_sha=$(sha256sum build/static/manifest.json | cut -d' ' -f1)
          docker build --platform linux/amd64 --provenance=false --sbom=false -f Dockerfile.static --build-arg VERSION="$GITHUB_SHA" --build-arg STATIC_MANIFEST_SHA256="$manifest_sha" -t manifests:test "$RUNNER_TEMP/static-package"
          docker save manifests:test -o "$RUNNER_TEMP/manifests-image.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.repository == 'TheOutdoorProgrammer/manifests.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: verified-image
          path: ${{ runner.temp }}/manifests-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: verify
    if: github.repository == 'TheOutdoorProgrammer/manifests.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: manifests-production-static
      cancel-in-progress: false
    env:
      IMAGE: us-east1-docker.pkg.dev/nwf-shared/apps/manifests-io-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-image
          path: ${{ runner.temp }}
      - run: |
          docker load -i "${RUNNER_TEMP}/manifests-image.tar"
          printf 'DOCKER_CONFIG=%s/manifests-docker\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: nwf-shared
          workload_identity_provider: projects/155511170166/locations/global/workloadIdentityPools/github/providers/github
          service_account: manifests-builder@nwf-shared.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - name: Authenticate to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: printf '%s' "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin https://us-east1-docker.pkg.dev
      - name: Check immutable revision tag
        id: revision
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const endpoint = `https://artifactregistry.googleapis.com/v1/projects/nwf-shared/locations/us-east1/repositories/apps/packages/manifests-io-static/tags/${process.env.GITHUB_SHA}`;
          const response = await fetch(endpoint, { headers: { Authorization: `Bearer ${process.env.ACCESS_TOKEN}` } });
          if (response.status !== 404 && !response.ok) throw new Error(`Revision lookup failed: HTTP ${response.status}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.ok}\n`);
          NODE
      - name: Verify existing revision is unchanged
        if: steps.revision.outputs.exists == 'true'
        run: |
          docker pull "$IMAGE:$GITHUB_SHA"
          expected=$(docker image inspect manifests:test --format '{{index .Config.Labels "org.manifests.static.manifest-sha256"}}')
          published=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .Config.Labels "org.manifests.static.manifest-sha256"}}')
          if [ "$expected" != "$published" ]; then
            echo '::error::This commit already has a different static manifest. Publish a new commit instead of replacing it.'
            exit 1
          fi
      - name: Publish immutable revision
        if: steps.revision.outputs.exists != 'true'
        run: |
          docker tag manifests:test "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Update production candidate
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is on main; keeping its production candidate.'
            exit 0
          fi
          if [ '${{ steps.revision.outputs.exists }}' = 'true' ]; then
            docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:production"
          else
            docker tag manifests:test "$IMAGE:production"
          fi
          docker push "$IMAGE:production"
          printf 'Published production candidate %s:%s. Start and approve the manifests production run in Spacelift to deploy it.\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        run: docker logout us-east1-docker.pkg.dev
