---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: workers.workers.spacelift.io
spec:
  group: workers.spacelift.io
  names:
    kind: Worker
    listKind: WorkerList
    plural: workers
    singular: worker
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.annotations.workers\.spacelift\.io/workerpool-name
      name: Pool
      type: string
    - jsonPath: .status.registered
      name: Registered
      type: boolean
    - jsonPath: .status.state
      name: Status
      type: string
    - jsonPath: .status.currentRunID
      name: Run ID
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Worker is the Schema for the workers API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkerSpec defines the desired state of Worker
            properties:
              replicas:
                default: 1
                description: |-
                  Replicas is always 1 for a Worker (each Worker maps to a single run pod).
                  Exposed via the scale subresource so PodDisruptionBudgets with percentage-based
                  minAvailable/maxUnavailable can compute expected pod counts.
                format: int32
                maximum: 1
                minimum: 1
                type: integer
            type: object
          status:
            description: WorkerStatus defines the observed state of Worker
            properties:
              currentRunID:
                type: string
              registered:
                type: boolean
              replicas:
                description: |-
                  Replicas reports how many pods are currently associated with this Worker:
                  1 while a run is executing (BUSY), 0 otherwise (IDLE or being deleted).
                  Required by the scale subresource contract.
                format: int32
                type: integer
              selector:
                description: |-
                  Selector is the label selector for pods owned by this Worker, exposed via
                  the scale subresource. Required by the scale subresource contract.
                type: string
              state:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}
